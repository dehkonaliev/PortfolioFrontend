<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <title>MyResume — Create your portfolio and get discovered</title>
  <meta name="description"
    content="Create a stunning resume and project portfolio. Get discovered by employers searching for talent across every field." />
  <link rel="canonical" href="https://myresume.uz/" />
  <meta name="robots" content="index, follow" />

    <!-- Open Graph / Telegram / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://curiosite.up.railway.app" />
  <meta property="og:title" content="Curiosite — Feed Your Curiosity" />
  <meta property="og:description"
    content="Curiosite is a modern learning platform where curiosity meets structured education. Explore courses, track your progress, and learn from expert instructors." />
  <meta property="og:image" content="https://curiosite.up.railway.app/logo-square.png" />
  <meta property="og:image:alt" content="Curiosite Logo" />
  <meta property="og:image:width" content="2000" />
  <meta property="og:image:height" content="2000" />
  <meta property="og:site_name" content="Curiosite" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:domain" content="myresume.uz" />
  <meta name="twitter:url" content="https://myresume.uz/" />
  <meta name="twitter:title" content="MyResume — Create your portfolio and get discovered" />
  <meta name="twitter:description" content="Create a stunning resume and project portfolio. Get discovered by employers searching for talent across every field." />
  <meta name="twitter:image" content="https://myresume.uz/cover.jpg" />
  <meta name="twitter:image:alt" content="MyResume — Create your portfolio and get discovered" />

  <script>
    (function () {
      var modes = {
        light: {
          icon: '/favicon_light/favicon.ico',
          apple: '/favicon_light/android-chrome-512x512.png',
          manifest: '/favicon_light/site.webmanifest',
        },
        dark: {
          icon: '/favicon_dark/favicon.ico',
          apple: '/favicon_dark/android-chrome-512x512.png',
          manifest: '/favicon_dark/site.webmanifest',
        },
      }

      function currentMode() {
        var stored = null
        try {
          var raw = localStorage.getItem('portfolio_theme')
          if (raw === 'light' || raw === 'dark') stored = raw
        } catch (e) { }
        if (!stored) {
          stored = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        if (document.documentElement.classList.contains('dark')) return 'dark'
        return stored
      }

      function apply(mode) {
        var m = modes[mode] || modes.light
        var icon = document.getElementById('favicon-link')
        var apple = document.getElementById('apple-touch-icon')
        var manifest = document.getElementById('manifest-link')
        if (icon) icon.setAttribute('href', m.icon)
        if (apple) apple.setAttribute('href', m.apple)
        if (manifest) manifest.setAttribute('href', m.manifest)
      }

      apply(currentMode())

      var observer = new MutationObserver(function () {
        apply(document.documentElement.classList.contains('dark') ? 'dark' : 'light')
      })
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] })
    })()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
