<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>MyResume — Create your portfolio and get discovered</title>
    <meta name="description" content="Create a stunning resume and project portfolio. Get discovered by employers searching for talent across every field." />
    <link rel="canonical" href="https://myresume.uz/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:site_name" content="MyResume" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MyResume — Create your portfolio and get discovered" />
    <meta property="og:description" content="Create a stunning resume and project portfolio. Get discovered by employers searching for talent across every field." />
    <meta property="og:image" content="/cover.jpg" />
    <meta property="og:url" content="https://myresume.uz/" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="MyResume — Create your portfolio and get discovered" />
    <meta property="twitter:description" content="Create a stunning resume and project portfolio. Get discovered by employers searching for talent across every field." />
    <meta property="twitter:image" content="/cover.jpg" />
    <link id="favicon-link" rel="icon" href="/favicon_light/favicon.ico" />
    <link id="apple-touch-icon" rel="apple-touch-icon" href="/favicon_light/android-chrome-512x512.png" />
    <link id="manifest-link" rel="manifest" href="/favicon_light/site.webmanifest" />
    <script>
      (function () {
        var modes = {
          light: {
            icon: '/favicon_light/favicon.ico',
            apple: '/favicon_light/android-chrome-512x512.png',
            manifest: '/favicon_light/site.webmanifest',
          },
          dark: {
            icon: '/favicon_dark/favicon.ico',
            apple: '/favicon_dark/android-chrome-512x512.png',
            manifest: '/favicon_dark/site.webmanifest',
          },
        }

        function currentMode() {
          var stored = null
          try {
            var raw = localStorage.getItem('portfolio_theme')
            if (raw === 'light' || raw === 'dark') stored = raw
          } catch (e) {}
          if (!stored) {
            stored = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          if (document.documentElement.classList.contains('dark')) return 'dark'
          return stored
        }

        function apply(mode) {
          var m = modes[mode] || modes.light
          var icon = document.getElementById('favicon-link')
          var apple = document.getElementById('apple-touch-icon')
          var manifest = document.getElementById('manifest-link')
          if (icon) icon.setAttribute('href', m.icon)
          if (apple) apple.setAttribute('href', m.apple)
          if (manifest) manifest.setAttribute('href', m.manifest)
        }

        apply(currentMode())

        var observer = new MutationObserver(function () {
          apply(document.documentElement.classList.contains('dark') ? 'dark' : 'light')
        })
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
